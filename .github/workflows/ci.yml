# Runs on every push and pull request: tests + a full build, so a broken change never reaches production.
# deploy/deploy.sh on the server deploys a commit only after this job ("test-and-build") passed for it.
name: CI
on:
  push:
    branches: [main]
  pull_request:
# The job only reads the code. Nothing here can push, comment or publish.
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to a full commit, so a moved tag cannot change what runs here. Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No package may run an install script.
      - run: npm ci --ignore-scripts
      - name: Check dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Check every page was built
        run: test "$(find dist -name '*.html' | wc -l)" -ge 35
